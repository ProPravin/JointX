{% extends "base.html" %}
{% block title %}Patients — JointX{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Patients</h1>
  <a href="/patients/new" class="btn btn-primary">+ New Patient</a>
</div>
<div class="card">
  <input type="text" id="search-box" placeholder="Search by name, code, or area..." class="search-input">
  <table class="data-table">
    <thead><tr><th>Code</th><th>Name</th><th>Age</th><th>Sex</th><th>Area</th><th></th></tr></thead>
    <tbody id="patients-tbody"></tbody>
  </table>
</div>
{% endblock %}
{% block extra_js %}
<script>
async function loadPatients(query) {
  const res = await JointX.api('/api/patients?q=' + encodeURIComponent(query || ''), 'GET');
  const tbody = document.getElementById('patients-tbody');
  tbody.innerHTML = '';
  if (!res.success) return;
  res.data.forEach(p => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${p.patient_code}</td><td>${p.full_name}</td><td>${p.age ?? ''}</td>
      <td>${p.sex ?? ''}</td><td>${p.village_or_area ?? ''}</td>
      <td><a class="btn btn-small" href="/patients/${p.id}">View</a></td>`;
    tbody.appendChild(tr);
  });
}
document.getElementById('search-box').addEventListener('input', (e) => loadPatients(e.target.value));
loadPatients('');
</script>
{% endblock %}
